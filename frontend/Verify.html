<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T1~T5 验算工作台 · SupplyGuard</title>
<style>
/* 视觉语言与 Dashboard.html 一致; 版式为通关流程: run芯片选择 + T1→T5步骤条 + 焦点详情 */
:root{
  --bg:#F1F4F3;
  --card:#FFFFFF;
  --ink:#1D2833;
  --sub:#66747E;
  --line:#E6EAE8;
  --shadow:0 1px 2px rgba(29,40,51,.04),0 6px 18px rgba(29,40,51,.06);
  --r:14px;
  --cinnabar:#C23B22;
  --green:#2E7D5B;
  --amber:#A8721A;
  --num:"Bahnschrift","Segoe UI","PingFang SC",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  font-size:14px;line-height:1.5;padding:0 20px 44px;
}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto}

/* ===== 顶栏 ===== */
.masthead{
  display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  padding:26px 2px 18px;
}
.brand{display:flex;align-items:center;gap:14px}
.logo{
  width:44px;height:44px;border-radius:12px;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;box-shadow:var(--shadow);
}
.brand h1{font-size:21px;font-weight:700;letter-spacing:.01em;line-height:1.2}
.brand .sub{color:var(--sub);font-size:13px;margin-top:1px}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.updated{color:var(--sub);font-size:12.5px}

button{
  font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:7px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;
  transition:border-color .15s,background .15s,transform .05s;
}
button:hover{border-color:#c9d2cf}
button:active{transform:translateY(1px)}
button:disabled{opacity:.5;cursor:wait}
button.primary{background:var(--ink);border-color:var(--ink);color:#fff}
button.primary:hover{background:#2a3a48;border-color:#2a3a48}
button:focus-visible,.runchip:focus-visible,.fnode:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ===== 卡片骨架 ===== */
.card{
  background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  border:1px solid rgba(29,40,51,.05);
  padding:18px 22px 20px;margin-top:14px;
}
.card h2{
  font-size:13px;font-weight:650;color:var(--sub);letter-spacing:.06em;
  display:flex;align-items:center;gap:9px;margin-bottom:14px;
}
.card h2::before{content:"";width:7px;height:7px;border-radius:2.5px;background:var(--ink)}
.card h2 .hint{font-weight:400;letter-spacing:0;font-size:12px}

body:not(.ready) .card{opacity:0;transform:translateY(8px)}
body.ready .card{opacity:1;transform:none;transition:opacity .5s ease,transform .5s ease}
body.ready .card:nth-of-type(1){transition-delay:.05s}
body.ready .card:nth-of-type(2){transition-delay:.15s}
@media (prefers-reduced-motion:reduce){
  body:not(.ready) .card{opacity:1;transform:none}
  body.ready .card{transition:none}
}

/* ===== run 芯片选择条 ===== */
.runpills{display:flex;gap:8px;flex-wrap:wrap}
.runchip{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--line);border-radius:10px;background:var(--card);
  padding:8px 14px;cursor:pointer;font-size:13px;
  transition:border-color .15s,background .15s;
}
.runchip:hover{border-color:#c9d2cf;background:#F6F8F7}
.runchip .rid{font-family:var(--num);font-weight:650}
.runchip .rt{color:var(--sub);font-size:12px}
.runchip .dot{width:8px;height:8px;border-radius:50%;flex:none}
.runchip.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.runchip.sel .rt{color:#B9C6D1}
.runchip.sel .dot{box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.dot--completed{background:var(--green)}
.dot--pending{background:#B9C2C9}

/* ===== T1→T5 通关步骤条 ===== */
.flow{display:flex;align-items:stretch;margin:6px 2px 22px}
.fnode{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  flex:none;cursor:pointer;padding:4px 6px 8px;border-radius:12px;
  min-width:88px;transition:background .15s;
}
.fnode:hover{background:#F6F8F7}
.fdot{
  width:44px;height:44px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--num);font-size:15px;font-weight:700;
  background:#EDF1F0;color:var(--sub);
  border:2px solid transparent;transition:transform .15s,box-shadow .15s;
}
.fnode .fname{font-size:12.5px;font-weight:650;text-align:center;line-height:1.3}
.fnode .fstatus{font-size:11.5px;font-weight:600}
.fnode.sel .fdot{transform:translateY(-2px);
  box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ink)}
/* 节点状态色 */
.fnode.good .fdot{background:#E7F2EC;color:var(--green)}
.fnode.good .fstatus{color:var(--green)}
.fnode.bad  .fdot{background:#F9E9E5;color:var(--cinnabar)}
.fnode.bad  .fstatus{color:var(--cinnabar)}
.fnode.warn .fdot{background:#F7F0E1;color:var(--amber)}
.fnode.warn .fstatus{color:var(--amber)}
.fnode.flat .fdot{background:#EDF1F0;color:var(--sub)}
.fnode.flat .fstatus{color:var(--sub)}
.fnode.dash .fdot{background:var(--card);color:var(--sub);border:2px dashed #c9d2cf}
.fnode.dash .fstatus{color:var(--sub)}
/* 连线 */
.flink{flex:1;height:2px;background:var(--line);border-radius:99px;
       align-self:center;margin:0 -2px 26px;min-width:12px}
.flink.off{opacity:.55}
@media (max-width:720px){
  .flow{flex-wrap:wrap}
  .flink{display:none}
}

/* ===== 焦点详情 ===== */
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;
             gap:16px;flex-wrap:wrap;margin-bottom:6px}
.detail-head .tname{font-size:16px;font-weight:700}
.detail-head .tdesc{color:var(--sub);font-size:12.5px;margin-top:2px;max-width:560px}
.verdict{
  display:inline-flex;align-items:center;gap:9px;flex:none;
  padding:8px 20px;border-radius:999px;font-size:17px;font-weight:700;line-height:1.3;
}
.verdict i{width:10px;height:10px;border-radius:50%;font-style:normal}
.verdict--good{background:#E7F2EC;color:var(--green)}
.verdict--good i{background:var(--green)}
.verdict--bad{background:#F9E9E5;color:var(--cinnabar)}
.verdict--bad i{background:var(--cinnabar)}
.verdict--warn{background:#F7F0E1;color:var(--amber)}
.verdict--warn i{background:var(--amber)}
.verdict--flat{background:#EDF1F0;color:var(--sub)}
.verdict--flat i{background:var(--sub)}
.verdict--dash{background:var(--card);color:var(--sub);border:1px dashed #c9d2cf}
.verdict--dash i{background:#B9C2C9}

.distbar{display:flex;height:8px;border-radius:99px;overflow:hidden;
         background:var(--line);margin:14px 0 8px}
.distbar i{display:block;height:100%}
.distbar i.s{background:var(--green)}
.distbar i.u{background:var(--cinnabar)}
.distbar i.k{background:#B9C2C9}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--sub);
        margin-bottom:16px}
.legend b{font-weight:650;color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:99px;
     margin-right:5px;vertical-align:baseline}

/* ===== 依赖明细 ===== */
.deps-table{width:100%;border-collapse:collapse;
            border:1px solid var(--line);border-radius:12px;overflow:hidden}
.deps-table th,.deps-table td{padding:10px 12px;border-bottom:1px solid #F0F3F1;
                              text-align:left;vertical-align:top;font-size:13px}
.deps-table thead th{background:#FAFBFB;font-weight:600;font-size:12px;color:var(--sub)}
.deps-table tbody tr:last-child td{border-bottom:none}
.deps-table .depkey{font-family:var(--num);font-size:12.5px;font-weight:650}
.reason{color:var(--sub);font-size:12.5px}
.badge{
  display:inline-block;padding:3px 10px;border-radius:999px;
  font-size:12px;font-weight:650;line-height:1.5;
}
.badge--bad{background:#F9E9E5;color:var(--cinnabar)}
.badge--good{background:#E7F2EC;color:var(--green)}
.badge--flat{background:#EDF1F0;color:var(--sub)}
details.ev{font-size:12.5px}
details.ev summary{cursor:pointer;color:var(--ink);font-size:12.5px;font-weight:600}
pre{background:#F6F8F7;border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;font-size:11.5px;font-family:var(--num);overflow:auto;
    max-height:160px;margin:6px 0 0;white-space:pre-wrap;word-break:break-all}
.summary-line{color:var(--sub);font-size:12.5px;margin-top:14px;
              border-top:1px solid #F0F3F1;padding-top:12px}

/* ===== run 元信息 ===== */
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;
       border-top:1px solid #F0F3F1;padding-top:14px}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:600;line-height:1.4;
  background:#EDF1F0;color:var(--sub);
}
.pill b{font-family:var(--num);font-weight:650;color:var(--ink)}

/* ===== 空态 ===== */
.empty{
  margin-top:14px;border:1px dashed var(--line);border-radius:var(--r);
  background:var(--card);padding:36px 20px;text-align:center;color:var(--sub);
}
.empty b{color:var(--ink);font-weight:650}
.empty p{margin-top:8px;font-size:12.5px}
.hidden{display:none}

@media (max-width:820px){
  .masthead{flex-direction:column;align-items:flex-start;gap:12px}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="brand">
      <div class="logo">验</div>
      <div>
        <h1>T1~T5 验算工作台</h1>
        <p class="sub">SupplyGuard 阶段03 · 关键保障任务全套验算（快照闭环，历史 run 只读）</p>
      </div>
    </div>
    <div class="meta">
      <button class="primary" id="btnNew" onclick="newRun()">新建 run 并验算</button>
      <button onclick="refreshRuns()">刷新</button>
      <span class="updated" id="busy"></span>
    </div>
  </header>

  <section class="card">
    <h2>验算台账 <span class="hint">点击切换历史 run · 只读，禁止修改</span></h2>
    <div class="runpills" id="runPills"><span class="updated">加载中…</span></div>
  </section>

  <section class="card" id="flowPanel">
    <h2>任务通关流程 <span class="hint">T1 → T5 串行执行 · 点击任务节点查看依赖明细</span></h2>
    <div class="flow" id="flow"></div>
    <div id="taskDetail"><div class="empty">尚未选择 run。<br>选择上方的历史 run，或点击「新建 run 并验算」。</div></div>
    <div class="pills hidden" id="runMeta"></div>
  </section>

</div>

<script>
const API = "http://127.0.0.1:8000";

const TASK_META = {
  T1: {short: "最低需求保障", name: "关键服务点最低需求保障",
       desc: "对每个关键服务点 × 每种物资：最新有效需求 → 最新有效签收 → 接收量 ≥ 需求量"},
  T2: {short: "运输链路可达", name: "运输链路可达保障",
       desc: "关键物资存在可用运输通道（AVAILABLE / IN_TRANSIT）"},
  T3: {short: "调度响应时效", name: "调度响应时效保障",
       desc: "每项最新需求提出后存在运输 / 签收活动响应"},
  T4: {short: "签收合规", name: "入库签收合规保障",
       desc: "每条签收记录可对应到同物资的库存观测闭环；有在途时必须有签收"},
  T5: {short: "证据一致性", name: "证据一致性校验",
       desc: "库存 / 运输 / 签收 / 需求观测之间无负值、非法状态、时间倒挂矛盾"}
};
const TASK_ORDER = ["T1", "T2", "T3", "T4", "T5"];
const VERDICT = {
  established:         {cls: "verdict--good", word: "成立"},
  blocked:             {cls: "verdict--bad",  word: "受阻"},
  pending_verification:{cls: "verdict--warn", word: "待验证"},
  unknown:             {cls: "verdict--flat", word: "未知"}
};
const NODE_CLS = {
  established: "good", blocked: "bad", pending_verification: "warn",
  unknown: "flat", null: "dash"
};
const NODE_WORD = {
  established: "成立", blocked: "受阻", pending_verification: "待验证",
  unknown: "未知", null: "未验算"
};
const DEP_TEXT = {satisfied: "满足", unsatisfied: "不满足", unknown: "未知"};
const DEP_BADGE = {satisfied: "badge--good", unsatisfied: "badge--bad", unknown: "badge--flat"};

let selectedRunId = null;
let selectedTask = "T1";
let currentTasks = {};   // task_id -> {result_status, summary_reason, dependency_checks}

async function api(path, opts) {
  const res = await fetch(API + path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || (res.status + " " + res.statusText));
  return body;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function fmtTime(s) { return (s || "").replace("T", " "); }

async function refreshRuns() {
  const runs = await api("/api/runs");
  const box = document.getElementById("runPills");
  if (!runs.length) {
    box.innerHTML = '<span class="updated">暂无验算记录 —— 点「新建 run 并验算」生成第一条</span>';
    return;
  }
  box.innerHTML = runs.map(r => `
    <div class="runchip${r.run_id === selectedRunId ? " sel" : ""}" tabindex="0"
         onclick="selectRun('${esc(r.run_id)}')"
         onkeydown="if(event.key==='Enter')selectRun('${esc(r.run_id)}')">
      <span class="dot ${r.run_status === "completed" ? "dot--completed" : "dot--pending"}"></span>
      <span class="rid">${esc(r.run_id)}</span>
      <span class="rt">${r.run_status === "completed" ? "已验算" : "待验算"} · ${esc(fmtTime(r.created_at).slice(0, 16))}</span>
    </div>`).join("");
}

async function newRun() {
  const btn = document.getElementById("btnNew");
  const busy = document.getElementById("busy");
  btn.disabled = true;
  try {
    busy.textContent = "抓取当前快照中…";
    const run = await api("/api/runs", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({scenario_id: "S1"})
    });
    busy.textContent = "已建 " + run.run_id + "，串行执行 T1~T5 判定…";
    const result = await api("/api/runs/" + run.run_id + "/execute", {method: "POST"});
    busy.textContent = "";
    selectedRunId = run.run_id;
    currentTasks = {};
    (result.tasks || []).forEach(t => {
      currentTasks[t.task_id] = {
        result_status: t.result_status,
        summary_reason: t.summary_reason,
        dependency_checks: t.dependency_checks || []
      };
    });
    await refreshRuns();
    renderAll({...result, tasks: result.tasks || []});
  } catch (e) {
    busy.textContent = "";
    alert("操作失败：" + e.message);
  } finally {
    btn.disabled = false;
  }
}

async function selectRun(runId) {
  selectedRunId = runId;
  await refreshRuns();
  try {
    // 兼容现有 GET task-result 接口: 并行拉取 T1~T5
    const arr = await Promise.all(TASK_ORDER.map(id =>
      api("/api/runs/" + runId + "/task-result?task_id=" + id)));
    currentTasks = {};
    TASK_ORDER.forEach((id, i) => {
      currentTasks[id] = {
        result_status: arr[i].task_result ? arr[i].task_result.result_status : null,
        summary_reason: arr[i].task_result ? arr[i].task_result.summary_reason : "",
        dependency_checks: arr[i].dependency_checks || []
      };
    });
    renderAll(arr[0]);
  } catch (e) {
    alert("加载失败：" + e.message);
  }
}

function renderAll(metaData) {
  renderFlow();
  renderDetail(metaData);
}

function renderFlow() {
  const box = document.getElementById("flow");
  box.innerHTML = TASK_ORDER.map((id, i) => {
    const t = currentTasks[id];
    const st = t ? t.result_status : null;
    const cls = NODE_CLS[st] || "dash";
    return `
      ${i ? '<div class="flink"></div>' : ""}
      <div class="fnode ${cls}${id === selectedTask ? " sel" : ""}" tabindex="0"
           data-task="${id}" onclick="selectTask('${id}')"
           onkeydown="if(event.key==='Enter')selectTask('${id}')">
        <div class="fdot">${id}</div>
        <div class="fname">${esc(TASK_META[id].short)}</div>
        <div class="fstatus">${esc(NODE_WORD[st] || "未验算")}</div>
      </div>`;
  }).join("");
}

function selectTask(taskId) {
  selectedTask = taskId;
  renderFlow();
  renderDetail(null);
}

function renderDetail(metaData) {
  const meta = document.getElementById("runMeta");
  if (metaData) {
    meta.classList.remove("hidden");
    meta.innerHTML = `
      <span class="pill">编号 <b>${esc(metaData.run_id)}</b></span>
      <span class="pill">场景 <b>${esc(metaData.scenario_id)}</b></span>
      <span class="pill">类型 <b>${esc(metaData.run_type)}</b></span>
      <span class="pill">run 状态 <b>${esc(metaData.run_status)}</b></span>
      <span class="pill">创建 <b>${esc(fmtTime(metaData.created_at) || "—")}</b></span>
      <span class="pill">完成 <b>${esc(fmtTime(metaData.completed_at) || "—")}</b></span>`;
  }

  const box = document.getElementById("taskDetail");
  if (!selectedRunId) {
    box.innerHTML = '<div class="empty">尚未选择 run。<br>选择上方的历史 run，或点击「新建 run 并验算」。</div>';
    return;
  }
  const tm = TASK_META[selectedTask];
  const t = currentTasks[selectedTask];
  const st = t ? t.result_status : null;
  const v = VERDICT[st] || {cls: "verdict--dash", word: "未验算"};

  if (!t) {
    box.innerHTML = `
      <div class="detail-head">
        <div>
          <div class="tname">${esc(selectedTask)} · ${esc(tm.name)}</div>
          <div class="tdesc">${esc(tm.desc)}</div>
        </div>
        <span class="verdict ${v.cls}"><i></i>${esc(v.word)}</span>
      </div>
      <div class="empty">该任务尚未执行验算。<br>历史 run 只读、无法补执行 —— 请新建一个 run 完成判定。</div>`;
    return;
  }

  const checks = t.dependency_checks || [];
  const n = {satisfied: 0, unsatisfied: 0, unknown: 0};
  checks.forEach(c => { if (n[c.status] !== undefined) n[c.status]++; });
  const seg = (k, cls) => n[k] ? `<i class="${cls}" style="flex:${n[k]}"></i>` : "";
  const dist = checks.length ? `
    <div class="distbar">${seg("satisfied","s")}${seg("unsatisfied","u")}${seg("unknown","k")}</div>
    <div class="legend">
      <span><span class="dot" style="background:var(--green)"></span>满足 <b>${n.satisfied}</b></span>
      <span><span class="dot" style="background:var(--cinnabar)"></span>不满足 <b>${n.unsatisfied}</b></span>
      <span><span class="dot" style="background:#B9C2C9"></span>未知 <b>${n.unknown}</b></span>
      <span>共 <b>${checks.length}</b> 项检查</span>
    </div>` : "";

  const rows = checks.length ? checks.map(c => `
    <tr>
      <td class="depkey">${esc(c.dep_key)}</td>
      <td>${esc(c.evidence?.service_id ?? c.evidence?.reserve_id ?? c.evidence?.transport_id ?? "—")}
          ${c.evidence?.material_id ? " · " + esc(c.evidence.material_id) : ""}</td>
      <td><span class="badge ${DEP_BADGE[c.status] || "badge--flat"}">${DEP_TEXT[c.status] || esc(c.status)}</span></td>
      <td><details class="ev"><summary>查看证据</summary><pre>${esc(JSON.stringify(c.evidence, null, 2))}</pre></details></td>
      <td class="reason">${esc(c.reason)}</td>
    </tr>`).join("")
    : `<tr><td colspan="5" style="text-align:center;color:var(--sub)">无依赖检查明细</td></tr>`;

  box.innerHTML = `
    <div class="detail-head">
      <div>
        <div class="tname">${esc(selectedTask)} · ${esc(tm.name)}</div>
        <div class="tdesc">${esc(tm.desc)}</div>
      </div>
      <span class="verdict ${v.cls}"><i></i>${esc(v.word)}</span>
    </div>
    ${dist}
    <table class="deps-table">
      <thead><tr><th>依赖键</th><th>检查对象</th><th>结论</th><th>证据</th><th>理由</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${t.summary_reason ? `<div class="summary-line">${esc(t.summary_reason)}</div>` : ""}`;
}

refreshRuns().then(() => {
  const first = document.querySelector("#runPills .runchip");
  if (first) selectRun(first.querySelector(".rid").textContent.trim());
  document.body.classList.add("ready");
});
</script>
</body>
</html>
