<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>应急物资保障 SupplyGuard</title>
<style>
  :root{
    --bg:#f7f8fa; --card:#fff; --line:#e5e7eb; --ink:#1f2328; --sub:#6b7280;
    --ok:#0f7b46; --warn:#b45309; --bad:#b91c1c; --pend:#7c3aed;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px}
  h1{font-size:20px;margin:0 0 4px;letter-spacing:.02em}
  .sub{color:var(--sub);font-size:13px;margin-bottom:20px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  button{border:1px solid var(--line);background:var(--card);color:var(--ink);
         padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px}
  button:hover{border-color:#c9ced6}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .card .n{font-size:24px;font-weight:600;line-height:1.2}
  .card .l{font-size:12px;color:var(--sub);margin-top:2px}
  .n.ok{color:var(--ok)} .n.bad{color:var(--bad)}
  .n.warn{color:var(--warn)} .n.pend{color:var(--pend)}
  table{width:100%;border-collapse:collapse;background:var(--card);
        border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
  th{background:#fafbfc;color:var(--sub);font-weight:500}
  tr:last-child td{border-bottom:0}
  .tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px}
  .t-ok{background:#e7f6ee;color:var(--ok)}
  .t-bad{background:#fdecec;color:var(--bad)}
  .t-warn{background:#fef3e2;color:var(--warn)}
  .t-pend{background:#f1eafe;color:var(--pend)}
  .note{color:var(--sub);font-size:12px}
  #out{margin-top:20px;background:var(--card);border:1px solid var(--line);
       border-radius:10px;padding:16px;display:none}
  #out h2{font-size:14px;margin:0 0 8px}
  code{background:#f2f4f7;padding:1px 6px;border-radius:4px;font-size:12px}
  .warnbox{margin-top:14px;background:#fff8e6;border:1px solid #f3e0b5;
           border-radius:8px;padding:10px 12px;font-size:13px;color:#7a4d00}
</style>
</head>
<body>
<div class="wrap">
  <h1>应急物资保障 SupplyGuard</h1>
  <div class="sub">校园极端天气演练 · 关键服务点物资保障任务认知工作台</div>

  <div class="bar">
    <button class="primary" onclick="analyze()">运行保障分析</button>
    <button onclick="sign('T-001', false)">模拟签收取证失败（T-001）</button>
    <button onclick="sign('T-002', true)">模拟签收成功（T-002）</button>
    <button onclick="reset()">重置演练数据</button>
  </div>

  <div class="cards">
    <div class="card"><div class="n ok" id="c-ok">–</div><div class="l">满足</div></div>
    <div class="card"><div class="n bad" id="c-bad">–</div><div class="l">缺口</div></div>
    <div class="card"><div class="n warn" id="c-warn">–</div><div class="l">部分满足</div></div>
    <div class="card"><div class="n pend" id="c-pend">–</div><div class="l">待验证</div></div>
  </div>

  <table id="tbl">
    <thead>
      <tr>
        <th>服务点</th><th>物资</th><th>需求</th><th>已到位</th>
        <th>在途</th><th>签收待验证</th><th>缺口</th><th>状态</th><th>说明</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="warnbox">
    <strong>核心语义：</strong>签收取证失败 ≠ 未送达。签收失败时该项判为
    <span class="tag t-pend">待验证</span>，需补取证后再下结论，不直接算缺口。
  </div>

  <div id="out">
    <h2>分析结果 <span class="note" id="runid"></span></h2>
    <div id="explain" class="note"></div>
  </div>
</div>

<script>
async function load(){
  const r = await fetch('/api/state');
  const d = await r.json();
  render(d.items, d.summary);
}
const cls = {'满足':'t-ok','缺口':'t-bad','部分满足':'t-warn','待验证':'t-pend'};
function render(items, s){
  document.getElementById('c-ok').textContent   = s['满足'];
  document.getElementById('c-bad').textContent  = s['缺口'];
  document.getElementById('c-warn').textContent = s['部分满足'];
  document.getElementById('c-pend').textContent = s['待验证'];
  document.querySelector('#tbl tbody').innerHTML = items.map(i => `
    <tr>
      <td>${i.site_name}</td>
      <td>${i.material}</td>
      <td>${i.demand}</td>
      <td>${i.delivered}</td>
      <td>${i.in_transit}</td>
      <td>${i.sign_pending || '–'}</td>
      <td>${i.gap_range[0] === i.gap_range[1] ? i.gap_range[0]
              : i.gap_range[0] + '–' + i.gap_range[1]}</td>
      <td><span class="tag ${cls[i.status]||''}">${i.status}</span></td>
      <td class="note">${i.note}</td>
    </tr>`).join('');
}
async function analyze(){
  const r = await fetch('/api/analyze', {method:'POST'});
  const d = await r.json();
  render(d.items, d.summary);
  document.getElementById('out').style.display = 'block';
  document.getElementById('runid').textContent = 'run_id: ' + d.run_id;
  document.getElementById('explain').textContent = d.explanation;
}
async function sign(id, ok){
  const r = await fetch(`/api/shipment/${id}/sign?ok=${ok}`, {method:'POST'});
  const d = await r.json();
  alert(d.msg);
  load();
}
async function reset(){
  await fetch('/api/reset', {method:'POST'});
  document.getElementById('out').style.display = 'none';
  load();
}
load();
</script>
</body>
</html>
