<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>供应保障值班台 · SupplyGuard</title>
<style>
:root{
  --bg:#F1F4F3;           /* 页面底 */
  --card:#FFFFFF;         /* 卡片 */
  --ink:#1D2833;          /* 主文字 */
  --sub:#66747E;          /* 次级文字 */
  --line:#E6EAE8;         /* 分隔线 */
  --shadow:0 1px 2px rgba(29,40,51,.04),0 6px 18px rgba(29,40,51,.06);
  --r:14px;               /* 卡片圆角 */
  --cinnabar:#C23B22;     /* 缺口 / 故障 */
  --green:#2E7D5B;        /* 富余 / 正常 */
  --amber:#A8721A;        /* 待命 / 连接中 */
  --blue:#3B6FB5;         /* W 饮用水 */
  --lite:#C98A2B;         /* L 应急照明 */
  --teal:#1F7A72;         /* R 急救包 */
  --num:"Bahnschrift","Segoe UI","PingFang SC",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  font-size:14px;line-height:1.5;padding:0 20px 44px;
}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto}

/* ===== 顶栏 ===== */
.masthead{
  display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  padding:26px 2px 18px;
}
.brand{display:flex;align-items:center;gap:14px}
.logo{
  width:44px;height:44px;border-radius:12px;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;box-shadow:var(--shadow);
}
.brand h1{font-size:21px;font-weight:700;letter-spacing:.01em;line-height:1.2}
.brand .sub{color:var(--sub);font-size:13px;margin-top:1px}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:600;line-height:1.4;
}
.conn i{width:8px;height:8px;border-radius:50%;font-style:normal}
.conn[data-st="connecting"]{background:#F7F0E1;color:var(--amber)}
.conn[data-st="connecting"] i{background:var(--amber)}
.conn[data-st="open"]{background:#E7F2EC;color:var(--green)}
.conn[data-st="open"] i{background:var(--green)}
.conn[data-st="closed"]{background:#F9E9E5;color:var(--cinnabar)}
.conn[data-st="closed"] i{background:var(--cinnabar)}
.clock{
  font-family:var(--num);font-size:15px;font-weight:600;color:var(--ink);
  background:var(--card);border:1px solid var(--line);padding:3px 12px;border-radius:999px;
}
.updated{color:var(--sub);font-size:12.5px}

/* ===== 卡片骨架 ===== */
.card{
  background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  border:1px solid rgba(29,40,51,.05);
  padding:18px 22px 20px;margin-top:14px;
}
.card h2{
  font-size:13px;font-weight:650;color:var(--sub);letter-spacing:.06em;
  display:flex;align-items:center;gap:9px;margin-bottom:14px;
}
.card h2::before{content:"";width:7px;height:7px;border-radius:2.5px;background:var(--ink)}
.card h2 .hint{font-weight:400;letter-spacing:0;font-size:12px}

/* 首次数据到达的整体亮相（仅一次） */
body:not(.ready) .card{opacity:0;transform:translateY(8px)}
body.ready .card{opacity:1;transform:none;transition:opacity .5s ease,transform .5s ease}
body.ready .card:nth-of-type(1){transition-delay:.05s}
body.ready .card:nth-of-type(2){transition-delay:.15s}
body.ready .card:nth-of-type(3){transition-delay:.25s}
@media (prefers-reduced-motion:reduce){
  body:not(.ready) .card{opacity:1;transform:none}
  body.ready .card{transition:none}
  .flash{animation:none!important}
}

/* ===== 物资总览 ===== */
.mats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mat{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px 14px;box-shadow:var(--shadow);
}
.mat-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mat-code{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--num);font-size:16px;font-weight:700;
}
.tone-blue{background:#E7EFF8;color:var(--blue)}
.tone-lite{background:#F8F0DF;color:var(--lite)}
.tone-teal{background:#E2F1EE;color:var(--teal)}
.mat-name{font-size:14px;font-weight:600}
.mat-nums{display:flex;gap:28px;margin-bottom:12px}
.mat-nums .k{display:block;color:var(--sub);font-size:12px;margin-bottom:2px}
.mat-nums .v{font-size:32px;font-weight:700;line-height:1.05}
.badge{
  display:inline-block;padding:4px 12px;border-radius:999px;
  font-size:12.5px;font-weight:650;line-height:1.4;
}
.badge--bad{background:#F9E9E5;color:var(--cinnabar)}
.badge--good{background:#E7F2EC;color:var(--green)}
.badge--warn{background:#F7F0E1;color:var(--amber)}
.badge--flat{background:#EDF1F0;color:var(--sub)}

/* ===== 台账表 ===== */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
table.ledger{width:100%;border-collapse:collapse}
.ledger th,.ledger td{padding:9px 10px;border-bottom:1px solid #F0F3F1;text-align:right}
.ledger th:first-child,.ledger td:first-child{text-align:left}
.ledger thead th{font-weight:600;font-size:12px;color:var(--sub);vertical-align:bottom;padding-bottom:10px}
.ledger thead th .m{font-family:var(--num);font-size:14px;color:var(--ink);display:block;line-height:1.2}
.ledger thead th small{display:block;font-weight:400;font-size:11px;color:var(--sub);margin-top:2px}
.ledger tbody td{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:16px;font-weight:550}
.ledger tbody tr:last-child td{border-bottom:none}
.ledger .row-name .code{font-size:15px;font-weight:650;display:block;line-height:1.2}
.ledger .row-name .nm{font-size:12px;color:var(--sub);display:block}

/* 数值变化闪烁 */
@keyframes flash{0%{background:#FBE3DC}100%{background:transparent}}
.flash{animation:flash 1.1s ease-out}

/* ===== 运输 ===== */
.vehicles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.veh{
  display:flex;align-items:center;gap:14px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 18px;box-shadow:var(--shadow);
}
.veh-code{
  width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--num);font-size:15px;font-weight:700;
}
.veh-cap{display:flex;align-items:center;gap:8px;margin-left:auto;color:var(--sub);font-size:13px}
.veh-cap .num{color:var(--ink);font-weight:650}
.caps{display:flex;gap:4px}
.caps i{width:8px;height:14px;border-radius:3px;background:var(--ink);opacity:.85}
.caps i.off{background:var(--line)}

/* ===== 空态 ===== */
.empty{
  margin-top:14px;border:1px dashed var(--line);border-radius:var(--r);
  background:var(--card);padding:36px 20px;text-align:center;color:var(--sub);
}
.empty b{color:var(--ink);font-weight:650}
.empty p{margin-top:8px;font-size:12.5px}
.hidden{display:none}

@media (max-width:760px){
  .grid2{grid-template-columns:1fr}
  .mats{grid-template-columns:1fr}
  .vehicles{grid-template-columns:1fr}
  .mat-nums .v{font-size:28px}
  .masthead{flex-direction:column;align-items:flex-start;gap:12px}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="brand">
      <div class="logo">保</div>
      <div>
        <h1>供应保障值班台</h1>
        <p class="sub">SupplyGuard 阶段01 实时供需运输看板</p>
      </div>
    </div>
    <div class="meta">
      <span class="pill conn" id="conn" data-st="connecting"><i></i><span id="connText">连接中</span></span>
      <span class="clock" id="clock">--:--:--</span>
      <span class="updated" id="updated">尚无数据</span>
    </div>
  </header>

  <section class="card">
    <h2>物资总览 <span class="hint">库存总量减去需求总量，负数即缺口</span></h2>
    <div class="mats" id="mats"></div>
  </section>

  <div class="grid2">
    <section class="card">
      <h2>储备点库存</h2>
      <table class="ledger">
        <thead>
          <tr>
            <th>储备点</th>
            <th><span class="m">W</span><small>饮用水</small></th>
            <th><span class="m">L</span><small>应急照明</small></th>
            <th><span class="m">R</span><small>急救包</small></th>
          </tr>
        </thead>
        <tbody id="reserveBody"></tbody>
      </table>
    </section>
    <section class="card">
      <h2>服务点需求</h2>
      <table class="ledger">
        <thead>
          <tr>
            <th>服务点</th>
            <th><span class="m">W</span><small>饮用水</small></th>
            <th><span class="m">L</span><small>应急照明</small></th>
            <th><span class="m">R</span><small>急救包</small></th>
          </tr>
        </thead>
        <tbody id="demandBody"></tbody>
      </table>
    </section>
  </div>

  <section class="card">
    <h2>运输车辆</h2>
    <div class="vehicles" id="vehicles"></div>
  </section>

  <div class="empty" id="empty">
    <b>等待实时数据</b>
    <p>页面已连接后端，若长时间无数据，请确认 uvicorn(8000) 与三个模拟器 reserve / demand / transport 均已启动。</p>
  </div>

</div>

<script>
const WS_URL = "ws://127.0.0.1:8000/ws/guarantee";
const MATS = [
  {code:"W", name:"饮用水", tone:"tone-blue"},
  {code:"L", name:"应急照明", tone:"tone-lite"},
  {code:"R", name:"急救包", tone:"tone-teal"},
];
const RESV_NAME = {R1:"物资仓库 1", R2:"物资仓库 2"};
const SVC_NAME  = {P1:"教学楼 A", P2:"图书馆", P3:"体育馆"};
const VEH_STATE = {
  AVAILABLE:{text:"正常", cls:"badge--good"},
  FAULT:    {text:"故障", cls:"badge--bad"},
};

let snapshot = null;
const prevVals = new Map();

/* ===== 连接状态 ===== */
function setConn(st, text){
  const el = document.getElementById("conn");
  el.dataset.st = st;
  document.getElementById("connText").textContent = text;
}

let retryTimer = null;
function connect(){
  const ws = new WebSocket(WS_URL);
  setConn("connecting", "连接中");
  ws.onopen = () => {
    clearTimeout(retryTimer); retryTimer = null;
    setConn("open", "已连接");
  };
  ws.onmessage = e => {
    snapshot = JSON.parse(e.data);
    render();
    document.getElementById("updated").textContent =
      "更新于 " + new Date().toTimeString().slice(0,8);
  };
  ws.onclose = () => {
    setConn("closed", "已断开，重连中");
    if (!retryTimer) retryTimer = setTimeout(connect, 5000);
  };
  ws.onerror = () => ws.close();
}
connect();

/* ===== 渲染 ===== */
function render(){
  if (!snapshot) return;
  document.body.classList.add("ready");
  document.getElementById("empty").classList.add("hidden");

  const stock = groupBy(snapshot.stock, "reserve_id", "material_id", "quantity");
  const demand = groupBy(snapshot.demand, "service_id", "material_id", "required_quantity");

  renderOverview(stock, demand);
  renderLedger(document.getElementById("reserveBody"), RESV_NAME, stock);
  renderLedger(document.getElementById("demandBody"), SVC_NAME, demand);
  renderVehicles(snapshot.transport);
}

function groupBy(list, k1, k2, v){
  const m = {};
  (list||[]).forEach(i => { (m[i[k1]] = m[i[k1]]||{})[i[k2]] = i[v]; });
  return m;
}

function total(map, mat){
  return Object.values(map).reduce((s,row) => s + (row[mat] ?? 0), 0);
}

function renderOverview(stock, demand){
  const wrap = document.getElementById("mats");
  wrap.innerHTML = "";
  MATS.forEach(({code, name, tone}) => {
    const s = total(stock, code), d = total(demand, code), gap = s - d;
    const badge = gap < 0 ? `<span class="badge badge--bad">缺口 ${-gap}</span>`
                : gap > 0 ? `<span class="badge badge--good">富余 ${gap}</span>`
                :           `<span class="badge badge--flat">均衡</span>`;
    const cell = document.createElement("div");
    cell.className = "mat";
    cell.innerHTML = `
      <div class="mat-top"><span class="mat-code ${tone}">${code}</span><span class="mat-name">${name}</span></div>
      <div class="mat-nums">
        <div><span class="k">库存</span><span class="v num" data-id="o-stock-${code}">${s}</span></div>
        <div><span class="k">需求</span><span class="v num" data-id="o-demand-${code}">${d}</span></div>
      </div>
      <div>${badge}</div>`;
    wrap.appendChild(cell);
  });
}

function renderLedger(tbody, names, map){
  tbody.innerHTML = "";
  Object.entries(names).forEach(([id, nm]) => {
    const row = map[id] || {};
    const cells = MATS.map(({code}) =>
      `<td class="num" data-id="c-${tbody.id}-${id}-${code}">${row[code] ?? "–"}</td>`).join("");
    tbody.insertAdjacentHTML("beforeend",
      `<tr><td class="row-name"><span class="code num">${id}</span><span class="nm">${nm}</span></td>${cells}</tr>`);
  });
  flashChanged();
}

function renderVehicles(list){
  const wrap = document.getElementById("vehicles");
  wrap.innerHTML = "";
  (list||[]).forEach(v => {
    const st = VEH_STATE[v.availability] || {text:"待命", cls:"badge--warn"};
    const cap = Number(v.capacity) || 0;
    const dots = Array.from({length: Math.max(cap, 0)}, (_,i) =>
      `<i class="${i < cap ? "" : "off"}"></i>`).join("");
    wrap.insertAdjacentHTML("beforeend", `
      <div class="veh">
        <span class="veh-code">${v.transport_id}</span>
        <span class="badge ${st.cls}">${st.text}</span>
        <span class="veh-cap">
          <span>容量</span><span class="num">${cap}</span>
          <span class="caps">${dots || '<i class="off"></i>'}</span>
        </span>
      </div>`);
  });
}

/* 数值变化闪烁：比较上一次渲染的值 */
function flashChanged(){
  document.querySelectorAll("[data-id]").forEach(el => {
    const id = el.dataset.id, v = el.textContent;
    const p = prevVals.get(id);
    if (p !== undefined && p !== v && p !== "–"){
      el.classList.add("flash");
      el.addEventListener("animationend", () => el.classList.remove("flash"), {once:true});
    }
    prevVals.set(id, v);
  });
}

/* ===== 时钟 ===== */
function tick(){
  document.getElementById("clock").textContent = new Date().toTimeString().slice(0,8);
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
